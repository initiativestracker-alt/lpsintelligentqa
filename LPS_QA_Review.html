<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quality Assurance: Review</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&family=Special+Elite&display=swap" rel="stylesheet">
<style>
:root{--green:#12996A;--green-d:#0E7C55;--blue:#2563A8;--blue-d:#1B4C82;--hdr:#EEF4FB;--line:#E3E8EE;--line2:#EEF1F4;--text:#1F2937;--muted:#5B6472;--bg:#F4F6F9;--ok:#1E8A5C;--bad:#C8322D;--amber:#D97A1E;color-scheme:light}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg)}
body{font-family:Poppins,'Segoe UI',Arial,sans-serif;color:var(--text);font-size:13px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--blue)}a:hover{color:var(--blue-d)}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.app{display:flex;min-height:100vh}
main{flex:1;min-width:0;display:flex;flex-direction:column}
.top{background:#fff;border-bottom:1px solid var(--line);padding:12px 22px;display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px}
.crumb{font-size:12px;color:var(--muted)}
h1{margin:0;font-size:19px;font-weight:500}
h2{margin:0;font-size:14px;font-weight:600}
.card{background:#fff;border:1px solid var(--line);border-radius:8px}
.muted{color:var(--muted)}
.small{font-size:12px}.xs{font-size:11px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:34px;padding:0 14px;border-radius:6px;border:1px solid transparent;font-size:13px;font-weight:500;cursor:pointer;white-space:nowrap;text-decoration:none;background:#fff}
.btn-sm{height:30px;padding:0 10px;font-size:12px}
.btn-primary{background:var(--green);border-color:var(--green);color:#fff}.btn-primary:hover{background:var(--green-d);color:#fff}
.btn-ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn-bad{background:var(--bad);border-color:var(--bad);color:#fff}
.btn-quiet{background:#fff;border-color:#D5DCE4;color:#4B5563}.btn-quiet:hover{border-color:#AEB7C2}
.btn-outline{background:#fff;border-color:var(--green);color:var(--green-d)}
.btn-blue{background:#F3F8FE;border-color:#9DBBE3;color:var(--blue-d)}
.btn-orange{background:#FFF6EE;border-color:#F2B37A;color:#9A4A00}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn-link{background:none;border:0;color:var(--blue);cursor:pointer;padding:4px;font-size:12px}
.pill{display:inline-block;font-size:11px;font-weight:500;border-radius:4px;padding:2px 8px;white-space:nowrap}
.p-ok{background:#E3F5EC;color:#166F4B}.p-warn{background:#FFF2D6;color:#7A4F00}.p-bad{background:#FDE7E5;color:#B42318}.p-info{background:#EAF2FD;color:#1B4C82}.p-grey{background:#EEF1F4;color:#4B5563}
.s-pending{background:#6B7380;color:#fff}.s-accepted{background:var(--ok);color:#fff}.s-rejected{background:var(--bad);color:#fff}
.tbl{width:100%;border-collapse:collapse;font-size:12px}
.tbl th{background:var(--hdr);color:var(--blue);font-weight:500;text-align:left;padding:8px 12px;white-space:nowrap}
.tbl td{padding:8px 12px;border-top:1px solid var(--line2)}
.num{text-align:right}
.scroll-x{overflow-x:auto}
.seg{display:flex;background:#EEF1F4;border-radius:6px;padding:3px}
.seg button{height:28px;padding:0 12px;border:0;border-radius:5px;background:transparent;cursor:pointer;font-size:12px;color:#374151}
.seg button[aria-pressed="true"],.seg button[aria-selected="true"]{background:var(--green);color:#fff;font-weight:500}
.track{height:6px;background:#EEF1F4;border-radius:3px;overflow:hidden;flex:1}
.track>div{height:100%;border-radius:3px}
@media (max-width:760px){.top{padding:12px 14px}}

.meta{display:flex;flex-wrap:wrap;align-items:center;gap:8px 20px;font-size:13px;width:100%}
.meta .k{color:var(--muted);margin-right:6px}
.meta b{font-weight:500}
.pager{display:inline-flex;align-items:center;border:1px solid #CBD3DC;border-radius:6px;overflow:hidden;vertical-align:middle}
.pager button{width:30px;height:30px;border:0;background:var(--green);color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center}
.pager button:disabled{background:#9FD3BE;cursor:not-allowed}
.pager span{padding:0 12px;font-weight:500}
.scope{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:8px 22px;background:#FFF8EC;border-bottom:1px solid #F3DDB8;font-size:12px;color:#6B4400}
.scope.all{background:#F3F8FE;border-color:#D6E4F5;color:var(--blue-d)}
.work{padding:14px;display:flex;flex-wrap:wrap;gap:14px;align-items:stretch}
.pane{flex:1 1 540px;min-width:0;display:flex;flex-direction:column}
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:6px;padding:8px 12px;border-bottom:1px solid var(--line)}
.tab{width:30px;height:30px;border-radius:6px;border:1px solid #D5DCE4;background:#fff;cursor:pointer;font-size:12px}
.tab[aria-pressed="true"]{background:var(--green);border-color:var(--green);color:#fff}
.tools{margin-left:auto;display:flex;align-items:center;gap:2px;border:1px solid #DDE3EA;border-radius:6px;padding:2px}
.tools button{width:32px;height:32px;border:0;background:none;color:#374151;cursor:pointer;display:flex;align-items:center;justify-content:center;border-radius:5px}
.tools button:hover{background:#F1F4F7}
.tools button[aria-pressed="true"]{background:#E7F0FC;color:var(--blue)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;padding:7px 12px;font-size:11px;color:var(--muted);background:#FAFBFC;border-bottom:1px solid var(--line2)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.viewer{height:780px;overflow:auto;background:#E6EAF0;padding:22px}
.paper{width:600px;min-height:740px;margin:0 auto;padding:32px 36px;transform-origin:top center;transition:transform .2s;box-shadow:0 2px 10px rgba(16,24,40,.18)}
.paper.orig{background:#FBF8F0;color:#2B2A26;font-family:'Special Elite','Courier New',monospace}
.paper.ocr{background:#fff;color:#1F2937;font-family:Poppins,sans-serif}
.blk{display:flex;flex-direction:column;gap:6px;width:100%;text-align:left;padding:9px 11px;margin:0 0 10px;border-radius:4px;cursor:pointer;font:inherit;color:inherit;background:transparent;border:1px dashed #8A94A3}
.blk.nohl{border-color:transparent}
.blk.focus{border:1.5px dashed #C77700;background:rgba(242,140,40,.06)}
.blk.dim{opacity:.5}
.blk.sel{border:2px solid #2F6FD6;background:rgba(47,111,214,.07);padding:8.5px 10.5px;opacity:1}
.blk .hd{display:flex;align-items:center;gap:8px;width:100%}
.num-b{width:21px;height:21px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-family:Poppins,sans-serif;font-size:11px;font-weight:600;background:#fff;border:1px solid #8A94A3}
.blk.sel .num-b{background:#2F6FD6;border-color:#2F6FD6;color:#fff}
.blk .body{display:flex;gap:14px;width:100%}
.blk .mg{flex:0 0 105px;font-size:11px;line-height:1.5}
.blk .tx{flex:1;font-size:13px;line-height:1.65}
.struck .h,.struck .mg,.struck .tx{text-decoration:line-through;text-decoration-color:#B42318}
.sumrow{display:flex;flex-direction:column;gap:8px;padding:8px 12px 10px;border-bottom:1px solid var(--line)}
.sumtop{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.sumcnt{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.sumcnt .cnt{display:flex;justify-content:space-between;align-items:stretch;font-size:12px}
.sumcnt .cnt span{padding:5px 9px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sumcnt .cnt b{padding:5px 10px;min-width:30px;text-align:center}
@media (max-width:520px){.sumcnt{grid-template-columns:repeat(2,minmax(0,1fr))}}
.cnt{display:inline-flex;border:1px solid;border-radius:5px;overflow:hidden;font-size:11px;white-space:nowrap;flex:0 0 auto}
.cnt span{padding:3px 7px}
.cnt b{padding:3px 7px;font-weight:600;color:#fff}
.elist{margin:8px 12px 0;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.ehead{display:flex;align-items:center;gap:8px;width:100%;min-height:34px;padding:6px 10px;background:var(--hdr);border:0;font-size:12px;color:var(--blue);cursor:pointer;text-align:left}
.ehead svg{transition:transform .15s}
.ehead[aria-expanded="false"] svg{transform:rotate(-90deg)}
.erow{display:grid;grid-template-columns:40px minmax(0,1fr) 84px 50px 92px;align-items:center;width:100%;border:0;border-top:1px solid var(--line2);background:#fff;font-size:12px;text-align:left;cursor:pointer}
.erow>span{padding:5px 10px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.erow.hdr{background:#F7FAFD;color:var(--blue);font-weight:500;font-size:11px;cursor:default}
.erow.focus{background:#FFF8EC}
.erow.skip{color:#8A94A3}
.erow.skip .pill{opacity:.7}
.erow.sel{background:#EAF2FD;color:var(--blue-d);font-weight:500;box-shadow:inset 3px 0 0 #2F6FD6}
.fgrid{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1.6fr) 76px 36px;gap:10px;align-items:center;padding:5px 6px}
.fgrid.h{font-size:11px;font-weight:500;color:var(--blue);background:var(--hdr);border-radius:6px 6px 0 0;padding:6px}
.fv{height:32px;width:100%;padding:0 9px;border-radius:5px;border:1px solid #D5DCE4;background:#fff;font-size:13px}
.fv.ed{border-color:#E39A4C;background:#FFFBF6}
.cbtn{position:relative;width:32px;height:32px;justify-self:center;border-radius:6px;cursor:pointer;display:flex;align-items:center;justify-content:center;background:#fff;border:1px solid #D5DCE4;color:#4B5563}
.cbtn.has{background:#FFF3E6;border-color:#F2B37A;color:#9A4A00}
.cbtn .dot{position:absolute;top:3px;right:3px;width:7px;height:7px;border-radius:50%;background:#F28C28}
.savednote{margin:0 6px 7px;padding:6px 9px;background:#FFF8EF;border:1px solid #F6D3AE;border-radius:6px;font-size:11px;color:#7A3E00}
.noteed{margin:0 6px 9px;display:flex;flex-direction:column;gap:6px;padding:9px;background:#F7FAFD;border:1px solid #D6E4F5;border-radius:6px}
.noteed textarea{font-size:12px;padding:7px 9px;border:1px solid #CBD3DC;border-radius:6px;resize:vertical}
.actions{margin-left:auto;display:flex;flex-wrap:wrap;align-items:center;gap:6px;padding:4px;border:1px solid var(--line);border-radius:8px;background:#FAFBFC}
.actions .btn{width:128px;height:34px;font-size:12px;padding:0 8px}
.sep{width:1px;height:22px;background:#D5DCE4;margin:0 3px}
.ovl{position:fixed;inset:0;background:rgba(17,24,39,.45);display:flex;justify-content:center;align-items:flex-start;padding-top:130px;z-index:50}
.dlg{width:min(500px,92%);background:#fff;border-radius:10px;box-shadow:0 20px 50px rgba(16,24,40,.25)}
.dlg label{display:flex;flex-direction:column;gap:5px;font-size:12px;font-weight:500;color:#374151}
.dlg select,.dlg textarea{border:1px solid #CBD3DC;border-radius:6px;padding:8px 10px;font-size:13px;background:#fff}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:#1F2937;color:#fff;font-size:13px;padding:11px 16px;border-radius:8px;box-shadow:0 10px 30px rgba(16,24,40,.3);z-index:60}
.ph{display:flex;flex-direction:column;align-items:center;gap:5px;padding-bottom:12px;border-bottom:1px solid #A9A08A;margin-bottom:12px}
.ph-row{display:flex;justify-content:space-between;width:100%;font-size:13px}
.ph .big{font-size:19px}
.run{display:flex;justify-content:space-between;font-size:12px;padding-bottom:9px;border-bottom:1px solid #A9A08A;margin-bottom:12px}
mark.fld{background:transparent;color:inherit;border-radius:2px;cursor:pointer;padding:0 1px}
.blk.sel mark.fld{background:rgba(255,205,40,.32)}
mark.fld.hit{background:rgba(255,160,0,.5)!important;outline:2px solid #E07B00;outline-offset:1px}
.imgwrap{position:relative;width:660px;max-width:100%;margin:0 auto;transform-origin:top center;transition:transform .2s;box-shadow:0 2px 10px rgba(16,24,40,.18);background:#fff}
.imgwrap img{display:block;width:100%;height:auto;user-select:none;-webkit-user-drag:none}
.viewer-mode{display:flex;align-items:center;gap:6px;margin-left:auto}
.viewer-mode-label{font-size:11px;color:var(--muted);white-space:nowrap}
.field-group-title{display:flex;justify-content:space-between;align-items:center;margin:14px 0 4px;padding:6px 7px;background:#F3F7FB;border-bottom:1px solid #DCE5EE;color:var(--blue-d);font-size:10px;font-weight:600;letter-spacing:.35px}
.field-group-title:first-of-type{margin-top:6px}
.missing-doc-page{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;padding:24px;text-align:center;box-sizing:border-box;background:#F1F3F6;border:1px solid #D3D8DF;color:#4B5563;font-size:13px}
.missing-doc-page span{font-size:11px;color:#6B7380}
.ov{position:absolute;inset:0}
.ebox{position:absolute;border:1.5px dashed rgba(90,100,115,.85);background:transparent;cursor:pointer;padding:0;border-radius:3px}
.ebox.nohl{border-color:transparent}.ebox.nohl .etag{display:none}
.ebox.focus{border:2px dashed #C77700;background:rgba(242,140,40,.07)}
.ebox.sel{border:2.5px solid #2F6FD6;background:rgba(47,111,214,.05)}
.ebox.inactive{border:2px solid #B42318;background:rgba(180,35,24,.08)}
.etag{position:absolute;top:0;left:-1px;transform:translateY(-100%);font:500 10px Poppins,sans-serif;background:#5A6473;color:#fff;padding:1px 6px;border-radius:3px 3px 0 0;white-space:nowrap}
.ebox.focus .etag{background:#B86A00}.ebox.sel .etag{background:#2F6FD6}
.ebox.inactive .etag{background:#B42318}
.fbox{position:absolute;background:rgba(255,205,40,.2);border:1px solid rgba(224,123,0,.55);border-radius:2px;cursor:pointer;padding:0}
.fbox.hit{background:rgba(255,160,0,.32);border:2px solid #E07B00}
.ocrview{width:600px;margin:0 auto;background:#fff;padding:26px 30px;box-shadow:0 2px 10px rgba(16,24,40,.12);transform-origin:top center;transition:transform .2s}
.ocrview .oe{border:1px dashed #C4CBD4;border-radius:4px;padding:9px 11px;margin-bottom:10px;cursor:pointer;display:block;width:100%;text-align:left;background:#fff;font-size:12px}
.ocrview .oe.sel{border:2px solid #2F6FD6;background:rgba(47,111,214,.05)}
.ocrview .oe.focus{border:1.5px dashed #C77700;background:rgba(242,140,40,.06)}
.flab{background:none;border:0;padding:0;text-align:left;font-size:12px;color:#374151;cursor:pointer;display:flex;align-items:center;gap:5px}
.flab svg{flex:0 0 auto;color:#8A94A3}
.flab[aria-pressed="true"]{color:#B35C00;font-weight:600}.flab[aria-pressed="true"] svg{color:#E07B00}
.frow.on{background:#FFF7E8}
.p-na{background:#EEF1F4;color:#5B6472}
</style>
</head>

<div class="app">
<main id="root"></main>

<script>
const STORE_KEY='lpsQA.allocation';
const REVIEW_KEY='lpsQA.review.v1';
const P=new URLSearchParams(location.search);
let STORED=null;try{STORED=JSON.parse(localStorage.getItem(STORE_KEY)||'null');}catch(e){}
const QA_MODE=STORED&&STORED.mode==='intelligent'?'intelligent':(P.get('mode')==='intelligent'?'intelligent':'random');
const FOCUS=STORED&&Array.isArray(STORED.entryTypes)?STORED.entryTypes:(P.has('et')?P.get('et').split('|').map(s=>s.trim()).filter(Boolean):[]);
const SAVED_AT=STORED&&STORED.savedAt?new Date(STORED.savedAt).toLocaleString('en-GB',{day:'2-digit',month:'short',minute:'2-digit'}):'';
const ALLOCATION_ID=STORED&&STORED.id?STORED.id:'manual-review';
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
// Where qa_ingest.py wrote the delivery. Served from the same folder as this page.
const DATA_ROOT='qa_data';

// Folios injected at build time. At runtime the loader at the foot of this file reads
// qa_data/index.json instead; this marker stays as a hand-edit escape hatch.
const IMPORTED=/*IMPORTED_START*/[]/*IMPORTED_END*/;
let DATA_BANNER='';

const RUN=(t,n)=>'<div class="run"><span>'+t+'</span><span>Sheet '+n+'</span></div>';
const MOCK={id:'DN-35846',file:'35846',county:'Down',batch:'B-234',analyst:'Analyst A03',kind:'mock',
 pages:[{head:'<div class="ph"><div class="ph-row"><span>COUNTY <span class="big">Down</span></span><span>FOLIO <span class="big">35846</span></span></div><span style="font-size:18px">Land Registry of Northern Ireland</span><span style="font-size:14px;letter-spacing:1px">REGISTER OF FREEHOLDERS</span></div>'},
  {head:RUN('Folio 35846, County Down',2)},{head:RUN('Folio 35846, County Down',3)},{head:RUN('Folio 35846, County Down',4)},{head:RUN('Folio 35846, County Down',5)}],
 items:[
  {type:'Description of Land',page:1,order:1,heading:'DESCRIPTION OF LANDS',margin:'Date of original registration [6]',text:'Being portions of the lands heretofore comprised in Folios [5]. No. [0] [1], [2], containing [4].',
   fields:[['Parcel No.','1','High'],['Townland','Townland_A (part)','High'],['Barony','Barony_A','High'],['County','Down','High'],['Area','0A 3R 1041 S.Yds','Medium'],['Prior Folio Refs','16499 and 16548','High'],['Original Registration Date','18th July 1924','Medium']]},
  {inactive:true,page:1,order:2,heading:'OWNERSHIP',margin:'Registered 6th August 1970 No. 10338/1970',text:'Owner_A of Address_A is registered as owner in fee-simple of the lands comprised in this Folio.'},
  {type:'Ownership',page:1,order:3,heading:'OWNERSHIP',margin:'Registered [4] No. [5]',text:'[0] of [1] is registered as owner in [3] of the land herein.',
   fields:[['Owner Name','Owner_B','High'],['Owner Address','Address_B','Medium'],['Owner Type','Individual','Medium'],['Estate','fee-simple','High'],['Registration Date','9th December 1981','High'],['Dealing No.','16284/81/1A','Low']]},
  {type:'Transfer of Part',page:2,order:1,heading:'TRANSFER OF PART',margin:'Registered [1] No. [0]',text:'Part of the lands herein shown [3] on the Registry map, [4], transferred to [2]. See Folio [5].',
   fields:[['Dealing No.','4471/1985','High'],['Transfer Date','14th March 1985','High'],['Transferee','Party_B','High'],['Part Description','coloured red','Medium'],['Map Reference','Sheet 248-12','High'],['New Folio','39102','High']]},
  {type:'Easement',page:2,order:2,heading:'EASEMENTS',margin:'Registered [5] No. 2210/1986',text:'The land herein is subject to a [0] [1] over the lane shown [4] on the Registry map for the benefit of the lands in Folio [3].',
   fields:[['Easement Type','right of way','Medium'],['Mode','on foot and with vehicles','Low'],['Benefit or Burden','Burden','Medium'],['Benefiting Folio','35210','High'],['Map Marking','hatched brown','Low'],['Instrument Date','2nd May 1986','Medium']]},
  {type:'Lease',page:3,order:1,heading:'LEASES',margin:'Registered [3] No. 3302/1979',text:'Parts of the land herein are subject to the Leases described in the Schedule hereto, each made by [1] to [2] for [4] years from [5]. Lease document [0].',
   fields:[['Lease Document','TY5498','High'],['Lessor','Party_A','High'],['Lessee','Party_C','Medium'],['Registration Date','1st October 1979','High'],['Term (Years)','999','High'],['Commencement','1st October 1979','Medium']]},
  {type:'Leasehold Particulars',page:3,order:2,heading:'LEASEHOLD PARTICULARS',margin:'Schedule to Lease [0]',text:'Yearly rent of [1] payable on the [2]. Lessee covenants as set out in the Lease. Map reference [4].',
   fields:[['Lease Reference','TY5498','High'],['Yearly Rent','one pound','Medium'],['Rent Payable','first day of October','Medium'],['Covenants Noted','Yes','Low'],['Map Reference','Sheet 248-12','High']]},
  {note:true,page:4,order:1,text:'Continuation sheet. Charges and burdens noted on this sheet are cancelled; no active entries on this image.'},
  {note:true,page:5,order:1,text:'Schedule map extract and Registry stamps. No textual entries to capture on this image.'}
 ]};

// Normalise every folio: entries sorted by page number, then entry order.
function normalise(list){return list.map(F=>{
  if(F.kind==='mock'){
    F.items.sort((a,b)=>a.page-b.page||a.order-b.order);
    F.E=F.items.filter(x=>x.fields||x.inactive).map(x=>Object.assign({},x,{id:x.id||x.order+'-'+x.type,fields:(x.fields||[]).map((f,k)=>({label:f[0],value:f[1],flag:f[2],onImage:(x.text+' '+x.margin).indexOf('['+k+']')>=0}))}));
  }else{
    F.E=F.entries.slice().sort((a,b)=>a.page-b.page||a.order-b.order).map(x=>({
      id:x.id,type:x.type,page:x.page,order:x.order,box:x.box||null,inactive:!!x.inactive,
      cancellationStatus:x.cancellationStatus||'',flag:x.flag||'',
      fields:(x.fields||[]).map(f=>({label:f.label,value:f.value,flag:f.flag||x.flag||'',box:f.box||null,onImage:!!f.box}))
    }));
  }

const root=document.getElementById('root');
root.addEventListener('click',e=>{const el=e.target.closest('[data-a]');if(!el||el.disabled)return;const a=el.dataset.a,v=el.dataset.v;const st=FS(),NP=FF().pages.length;

    case 'zout':S.zoom=Math.max(50,S.zoom-10);break;
    case 'fit':S.zoom=90;S.rot=0;break;
    case 'rot':S.rot=(S.rot+90)%360;break;
    case 'reset':S.zoom=100;S.rot=0;break;

// Load qa_data/ (written by qa_ingest.py) into FOLIOS. With no delivery present the
// built-in sample folio is shown so the page is never blank.
async function boot(){
  let folios=null,note='';
  try{
    const res=await fetch(DATA_ROOT+'/index.json',{cache:'no-store'});
    if(!res.ok)throw new Error('HTTP '+res.status);
    const index=await res.json();
    let items=[];
    (index.batches||[]).forEach(b=>(b.items||[]).forEach(it=>items.push(Object.assign({batch:b.name},it))));
    const total=items.length;let scopeTxt='';
    if(STORED){
      const allocated=Array.isArray(STORED.folioIds)?STORED.folioIds:(Array.isArray(STORED.folios)?STORED.folios:[]);
      if(allocated.length&&!allocated.includes('ALL')){
        const byId=new Map(items.map(item=>[item.id,item]));
        items=allocated.map(id=>byId.get(id)).filter(Boolean);
      }else{
        const bs=Array.isArray(STORED.batches)?STORED.batches:[],fs=Array.isArray(STORED.folios)?STORED.folios:[];
        if(bs.length&&!bs.includes('ALL'))items=items.filter(it=>bs.includes(it.batch));
        if(fs.length&&!fs.includes('ALL'))items=items.filter(it=>fs.includes(it.id));
      }
      if(allocated.length||STORED.batches||STORED.folios)scopeTxt=' Showing the allocated scope: '+items.length+' of '+total+' folio'+(total===1?'':'s')+'.';
    }
    folios=await Promise.all(items.map(it=>fetch(it.json,{cache:'no-store'}).then(r=>r.json())));
    folios.forEach(F=>{
      const assigned=STORED?.analystByFolio?.[F.id];
      F.analyst=assigned?'Analyst '+assigned:(!F.analyst||F.analyst==='Unassigned'?'Analyst A03':F.analyst);
    });
    if(folios.length)note='Loaded <b>'+folios.length+'</b> folio'+(folios.length===1?'':'s')+' from <code>'+DATA_ROOT+'</code>.'+scopeTxt;
    else DATA_BANNER='No folios match the allocated scope. Open <a href="LPS_QA_Allocation.html">Allocation</a>, widen the scope or Reset, then allocate again.';
  }catch(err){
    DATA_BANNER='No ingested data found at <code>'+DATA_ROOT+'</code>, so the built-in sample folio is shown.';
  }
  if(folios===null)folios=[MOCK];
  FOLIOS=normalise(folios);
  if(FOLIOS.length&&!DATA_BANNER)DATA_BANNER=note;
  S.fs=newFs();
  restoreSavedFields();
  const next=FOLIOS.findIndex((_folio,index)=>!S.fs[index].submitted);
  if(next<0)S.complete=true;
  else S.f=next;
  render();
}
boot();
