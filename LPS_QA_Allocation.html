<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>XDAS – Quality Assurance: Allocation</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--green:#12996A;--green-d:#0E7C55;--blue:#2563A8;--blue-d:#1B4C82;--hdr:#EEF4FB;--line:#E3E8EE;--line2:#EEF1F4;--text:#1F2937;--muted:#5B6472;--bg:#F4F6F9;--ok:#1E8A5C;--bad:#C8322D;--amber:#D97A1E;color-scheme:light}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg)}
body{font-family:Poppins,'Segoe UI',Arial,sans-serif;color:var(--text);font-size:13px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--blue)}a:hover{color:var(--blue-d)}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.app{display:flex;min-height:100vh}
main{flex:1;min-width:0;display:flex;flex-direction:column}
.top{background:#fff;border-bottom:1px solid var(--line);padding:12px 22px;display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px}
.crumb{font-size:12px;color:var(--muted)}
h1{margin:0;font-size:19px;font-weight:500}
h2{margin:0;font-size:14px;font-weight:600}
.card{background:#fff;border:1px solid var(--line);border-radius:8px}
.muted{color:var(--muted)}
.small{font-size:12px}.xs{font-size:11px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:34px;padding:0 14px;border-radius:6px;border:1px solid transparent;font-size:13px;font-weight:500;cursor:pointer;white-space:nowrap;text-decoration:none;background:#fff}
.btn-sm{height:30px;padding:0 10px;font-size:12px}
.btn-primary{background:var(--green);border-color:var(--green);color:#fff}.btn-primary:hover{background:var(--green-d);color:#fff}
.btn-ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn-bad{background:var(--bad);border-color:var(--bad);color:#fff}
.btn-quiet{background:#fff;border-color:#D5DCE4;color:#4B5563}.btn-quiet:hover{border-color:#AEB7C2}
.btn-outline{background:#fff;border-color:var(--green);color:var(--green-d)}
.btn-blue{background:#F3F8FE;border-color:#9DBBE3;color:var(--blue-d)}
.btn-orange{background:#FFF6EE;border-color:#F2B37A;color:#9A4A00}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn-link{background:none;border:0;color:var(--blue);cursor:pointer;padding:4px;font-size:12px}
.pill{display:inline-block;font-size:11px;font-weight:500;border-radius:4px;padding:2px 8px;white-space:nowrap}
.p-ok{background:#E3F5EC;color:#166F4B}.p-warn{background:#FFF2D6;color:#7A4F00}.p-bad{background:#FDE7E5;color:#B42318}.p-info{background:#EAF2FD;color:#1B4C82}.p-grey{background:#EEF1F4;color:#4B5563}
.s-pending{background:#6B7380;color:#fff}.s-accepted{background:var(--ok);color:#fff}.s-rejected{background:var(--bad);color:#fff}
.tbl{width:100%;border-collapse:collapse;font-size:12px}
.tbl th{background:var(--hdr);color:var(--blue);font-weight:500;text-align:left;padding:8px 12px;white-space:nowrap}
.tbl td{padding:8px 12px;border-top:1px solid var(--line2)}
.num{text-align:right}
.scroll-x{overflow-x:auto}
.seg{display:flex;background:#EEF1F4;border-radius:6px;padding:3px}
.seg button{height:28px;padding:0 12px;border:0;border-radius:5px;background:transparent;cursor:pointer;font-size:12px;color:#374151}
.seg button[aria-pressed="true"],.seg button[aria-selected="true"]{background:var(--green);color:#fff;font-weight:500}
.track{height:6px;background:#EEF1F4;border-radius:3px;overflow:hidden;flex:1}
.track>div{height:100%;border-radius:3px}
@media (max-width:760px){.top{padding:12px 14px}}

.wrap{padding:20px 22px 40px;display:flex;flex-wrap:wrap;gap:20px;align-items:flex-start}
.col-main{flex:999 1 600px;min-width:0;display:flex;flex-direction:column;gap:16px}
.col-side{flex:1 1 330px;min-width:0;display:flex;flex-direction:column;gap:16px}
.sec{padding:16px 18px;display:flex;flex-direction:column;gap:12px}
.modes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.mode{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border:1px solid #D5DCE4;border-radius:8px;cursor:pointer;background:#fff}
.mode.on{border:2px solid var(--green);background:#F1FAF6;padding:11px 13px}
.mode input{width:17px;height:17px;margin:2px 0 0;accent-color:var(--green)}
.mode b{font-weight:500;font-size:14px;display:block}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 18px}
.dd{position:relative;display:flex;flex-direction:column;gap:5px;min-width:0}
.dd>label{font-size:12px;font-weight:500;color:#374151}
.dd.off>label{color:#6B7280}
.dd-btn{display:flex;align-items:center;justify-content:space-between;gap:8px;height:38px;padding:0 11px;border:1px solid #CBD3DC;border-radius:6px;background:#fff;cursor:pointer;text-align:left;font-size:13px}
.dd-btn span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dd-btn[aria-expanded="true"]{border-color:var(--green);box-shadow:0 0 0 3px rgba(18,153,106,.15)}
.dd-btn:disabled{background:#F3F5F8;border-style:dashed;color:#6B7280;cursor:not-allowed}
.dd-panel{position:absolute;top:64px;left:0;right:0;z-index:30;background:#fff;border:1px solid #D5DCE4;border-radius:8px;box-shadow:0 10px 28px rgba(16,24,40,.14);padding:6px;max-height:300px;overflow:auto}
.dd-grp{padding:9px 10px 3px;font-size:11px;font-weight:600;color:#4B5563}
.dd-opt{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:6px;cursor:pointer;font-size:13px}
.dd-opt:hover{background:#F5F8FB}
.dd-opt input{width:15px;height:15px;accent-color:var(--green)}
.dd-opt em{font-style:normal;margin-left:auto;font-size:11px;color:var(--muted)}
.dd-foot{display:flex;justify-content:flex-end;border-top:1px solid var(--line2);margin-top:4px;padding:7px 4px 2px}
.note{display:flex;align-items:center;gap:8px;background:#F3F8FE;border:1px solid #D6E4F5;border-radius:8px;padding:9px 12px;font-size:12px;color:var(--blue-d)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{height:30px;padding:0 12px;border-radius:999px;border:1px solid #CBD3DC;background:#fff;cursor:pointer;font-size:12px}
.chip[aria-pressed="true"]{background:var(--green);border-color:var(--green);color:#fff}
.prev-h{background:var(--hdr);padding:12px 16px;border-bottom:1px solid #DCE6F2;display:flex;align-items:center;gap:8px;border-radius:8px 8px 0 0}
.big{font-size:26px;font-weight:600;color:var(--green);line-height:1.1}
.kv{display:flex;justify-content:space-between;gap:10px;font-size:12px}
.kv b{font-weight:500}
.alert{font-size:12px;color:#B42318;background:#FEF1F0;border:1px solid #F7C9C4;border-radius:6px;padding:8px 11px}
.okbox{display:flex;flex-direction:column;gap:8px;background:#E9F7F0;border:1px solid #BFE6D3;border-radius:8px;padding:12px}
@media (max-width:760px){.modes,.grid2{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="app">
<main>
<header class="top">
<div><div class="crumb">Mojo / Quality Assurance</div><h1>Quality Assurance: Allocation</h1></div>
<div style="margin-left:auto;display:flex;align-items:center;gap:12px;flex-wrap:wrap">
<span class="small muted">Project: LPS Folio Digitization</span>
<a id="goReview" class="btn btn-blue btn-sm" href="LPS_QA_Review.html">Go to Review</a>
</div>
</header>
<div id="root"></div>
</main>
</div>
<script>
const DATA_ROOT='qa_data';
const STORE_KEY='lpsQA.allocation';
// Batches, folios and entry types all come from qa_data/index.json (written by qa_ingest.py).
let BATCHES=[],FOLIOS={},ETS=[],ALL_FOLIOS=[];
const ANALYSTS=['A01','A02','A03','A04','A05','A06','A07','A08'];
const EXPERTS=[['E1','LPS QA Expert 1','14 open'],['E2','LPS QA Expert 2','9 open'],['E3','LPS QA Expert 3','22 open'],['E4','LPS QA Expert 4','0 open'],['E5','LPS QA Expert 5','6 open']];
const DEF=()=>({batch:['ALL'],folio:['ALL'],et:['ALL'],tags:[],analyst:['ALL']});
const S={mode:'random',open:null,pct:10,allocated:false,err:'',ready:false,allocatedScope:null,sel:Object.assign(DEF(),{expert:['ALL']})};
const fmt=n=>Math.round(n).toLocaleString('en-GB');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const CHEV='<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>';

function items(id){
  if(id==='batch')return BATCHES.map(b=>({v:b.v,label:b.v,short:b.v,meta:fmt(b.folios)+(b.folios===1?' folio':' folios')}));
  if(id==='folio'){const o=[];selBatches().forEach(b=>{o.push({group:'Batch '+b.v});(FOLIOS[b.v]||[]).forEach(f=>o.push({v:f,label:f,meta:b.v}));});return o;}
  if(id==='et')return ETS.map(e=>({v:e[0],label:e[0],meta:Math.round(e[1]*100)+'%'}));
  if(id==='tags')return [{group:'Script'},{v:'hw',label:'Handwritten'},{v:'ty',label:'Typed'},{group:'AI confidence flag'},{v:'ch',label:'High confidence',short:'High'},{v:'cm',label:'Medium confidence',short:'Med'},{v:'cl',label:'Low confidence',short:'Low'},{group:'Include notes'},{v:'nf',label:'Full text notes'},{v:'nm',label:'Marginal notes'}];
  if(id==='analyst')return ANALYSTS.map(a=>({v:a,label:'Mobius Analyst '+a,short:a}));
  if(id==='expert')return EXPERTS.map(e=>({v:e[0],label:e[1],short:e[1].replace('LPS QA ',''),meta:e[2]}));
}
const CFG=()=>({batch:['Select Batch(es)',true,'All Batches','Choose one or more batches'],folio:['Select Folio(s) within Batches',true,'All folios in selected batches','Choose folios'],et:['Entry Types for QA',true,'All entry types ('+ETS.length+')','Choose entry types'],tags:['Review Tags',false,'','No tags (all records)'],analyst:['Mobius Analysts',true,'All analysts','Choose analysts'],expert:['LPS QA Expert(s)',true,'All experts','Choose who reviews']});
function selBatches(){const b=S.sel.batch;return BATCHES.filter(x=>b.includes('ALL')||b.includes(x.v));}
function selectedEntryTypes(){return S.mode==='intelligent'&&!S.sel.et.includes('ALL')?S.sel.et.slice():[];}
function eligibleFolios(){
  const batches=S.sel.batch,folios=S.sel.folio,types=selectedEntryTypes();
  return ALL_FOLIOS.filter(item=>
    (batches.includes('ALL')||batches.includes(item.batch))&&
    (folios.includes('ALL')||!folios.length||folios.includes(item.id))&&
    (!types.length||Array.isArray(item.entryTypes)&&types.some(type=>item.entryTypes.includes(type))));
}
function entriesInScope(item){
  const types=selectedEntryTypes(),counts=item.entryTypeCounts||{};
  return types.length?types.reduce((total,type)=>total+(counts[type]||0),0):(item.entries||0);
}
function allOn(id){const its=items(id).filter(o=>!o.group);const s=S.sel[id];return CFG()[id][1]&&(s.includes('ALL')||(its.length>1&&its.every(o=>s.includes(o.v))));}
function toggle(id,v){
  const its=items(id).filter(o=>!o.group).map(o=>o.v);let cur=S.sel[id].slice();
  if(v==='ALL'){cur=allOn(id)?[]:['ALL'];}
  else{if(cur.includes('ALL'))cur=its.slice();cur=cur.includes(v)?cur.filter(x=>x!==v):cur.concat([v]);if(id!=='tags'&&its.length>1&&its.every(x=>cur.includes(x)))cur=['ALL'];}
  S.sel[id]=cur;S.allocated=false;S.allocatedScope=null;S.err='';render();
}
function dd(id,disabled){
  const [label,hasAll,allLabel,ph]=CFG()[id];const its=items(id);const s=S.sel[id];const all=allOn(id);
  const picked=its.filter(o=>!o.group&&s.includes(o.v)).map(o=>o.short||o.label);
  let sum=ph;if(all)sum=allLabel;else if(picked.length)sum=picked.length<=2?picked.join(', '):picked.slice(0,2).join(', ')+' +'+(picked.length-2)+' more';
  const open=S.open===id&&!disabled;
  let h='<div class="dd'+(disabled?' off':'')+'"><label id="l-'+id+'">'+label+'</label><button type="button" class="dd-btn" data-a="open" data-v="'+id+'" aria-labelledby="l-'+id+'" aria-expanded="'+open+'"'+(disabled?' disabled':'')+'><span>'+esc(sum)+'</span>'+CHEV+'</button>';
  if(open){
    h+='<div class="dd-panel" role="group" aria-label="'+label+'">';
    if(hasAll)h+='<label class="dd-opt"><input type="checkbox" data-c="tog" data-id="'+id+'" data-v="ALL"'+(all?' checked':'')+'>'+allLabel+'</label>';
    its.forEach(o=>{if(o.group)h+='<div class="dd-grp">'+o.group+'</div>';else h+='<label class="dd-opt"><input type="checkbox" data-c="tog" data-id="'+id+'" data-v="'+esc(o.v)+'"'+(all||s.includes(o.v)?' checked':'')+'>'+esc(o.label)+(o.meta?'<em>'+o.meta+'</em>':'')+'</label>';});
    h+='<div class="dd-foot"><button type="button" class="btn btn-primary btn-sm" data-a="close">Done</button></div></div>';
  }
  return h+'</div>';
}
function calc(){
  const isInt=S.mode==='intelligent',sb=selBatches(),eligible=eligibleFolios();
  const pe=eligible.reduce((total,item)=>total+entriesInScope(item),0);
  const types=selectedEntryTypes();
  const etc=types.length?types.length+' selected':'All '+ETS.length+' in-scope';
  return {isInt,sb,eligible,pf:eligible.length,pe,etc,
    sF:eligible.length?Math.ceil(eligible.length*S.pct/100):0,
    sE:pe?Math.ceil(pe*S.pct/100):0};
}
function reviewHref(){
  const scope=S.allocated?S.allocatedScope:null;
  const p=new URLSearchParams();p.set('mode',scope?.mode||S.mode);
  const es=scope?.entryTypes||[];
  if(es.length)p.set('et',es.join('|'));
  return 'LPS_QA_Review.html?'+p.toString();
}
function scopeRecord(chosen){
  const selectedAnalysts=S.sel.analyst.includes('ALL')||!S.sel.analyst.length?['A03']:S.sel.analyst.slice();
  const analystByFolio={};
  chosen.forEach((item,index)=>{analystByFolio[item.id]=selectedAnalysts[index%selectedAnalysts.length];});
  return {id:Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,8),mode:S.mode,
    batches:[...new Set(chosen.map(item=>item.batch))],folios:chosen.map(item=>item.id),
    folioIds:chosen.map(item=>item.id),entryTypes:selectedEntryTypes(),analysts:selectedAnalysts,
    analystByFolio,experts:S.sel.expert.slice(),sampling:S.pct,
    entryCount:chosen.reduce((total,item)=>total+entriesInScope(item),0),savedAt:new Date().toISOString()};
}
function saveScope(){if(!S.allocatedScope)return;try{localStorage.setItem(STORE_KEY,JSON.stringify(S.allocatedScope));}catch(e){}}
function render(){
  if(!S.ready){
    document.getElementById('root').innerHTML='<div class="wrap"><div class="col-main"><section class="card sec"><h2>No ingested data</h2><span class="small muted">No <code>'+DATA_ROOT+'/index.json</code> was found, so there are no batches to allocate. Ingest a delivery first:</span><pre class="small" style="margin:0;background:#F3F5F8;border:1px solid var(--line);border-radius:6px;padding:10px">python qa_ingest.py "&lt;root folder&gt;"</pre><span class="small muted">Then serve this folder (<code>python -m http.server 8080</code>) and reload.</span></section></div></div>';
    document.getElementById('goReview').href='LPS_QA_Review.html';
    return;
  }
  const c=calc();const xs=S.sel.expert;const ch=EXPERTS.filter(e=>xs.includes('ALL')||xs.includes(e[0]));const n=ch.length;
  const card=(on,v,t,d)=>'<label class="mode'+(on?' on':'')+'"><input type="radio" name="m" data-c="mode" value="'+v+'"'+(on?' checked':'')+'><span><b>'+t+'</b><span class="small muted">'+d+'</span></span></label>';
  let h='<div class="wrap"><div class="col-main">';
  h+='<section class="card sec" aria-labelledby="h1m"><h2 id="h1m">QA Mode</h2><div class="modes">'+card(!c.isInt,'random','Random QA (all stratums)','Unbiased sample across every stratum in the chosen batches. Only batch and sampling % apply.')+card(c.isInt,'intelligent','Intelligent QA (critical aspects)','Target folios, entry types, review tags and analysts that carry the most risk.')+'</div></section>';
  h+='<section class="card sec" aria-labelledby="h2s"><div style="display:flex;align-items:center;gap:10px"><h2 id="h2s">Scope</h2><button type="button" class="btn-link" style="margin-left:auto" data-a="reset">Reset Filters</button></div>'+dd('batch',false);
  if(!c.isInt)h+='<div class="note"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/></svg>Folio, entry type, review tag and analyst filters switch on with Intelligent QA.</div>';
  else if(!S.sel.et.includes('ALL')&&S.sel.et.length)h+='<div class="note">Reviewers will see the '+S.sel.et.length+' selected entry type(s) highlighted as QA focus in each folio; other entries can be skipped.</div>';
  h+='<div class="grid2">'+dd('folio',!c.isInt)+dd('et',!c.isInt)+dd('tags',!c.isInt)+dd('analyst',!c.isInt)+'</div></section>';
  h+='<section class="card sec" aria-labelledby="h3p"><div style="display:flex;align-items:baseline;gap:10px;flex-wrap:wrap"><h2 id="h3p">Set Sampling %</h2><span class="small muted">Applies to both QA modes. LPS starts at 100% and lowers it only on delegated authority.</span></div>';
  h+='<div style="display:flex;align-items:center;gap:14px;flex-wrap:wrap"><input id="pctR" type="range" min="1" max="100" value="'+S.pct+'" data-c="pct" data-i="pctlive" aria-label="Sampling percentage" style="flex:1 1 260px;accent-color:var(--green)"><label class="small" style="display:flex;align-items:center;gap:6px"><input id="pctN" type="number" min="1" max="100" value="'+S.pct+'" data-c="pct" aria-label="Sampling percentage value" style="width:68px;height:34px;border:1px solid #CBD3DC;border-radius:6px;padding:0 8px">%</label></div>';
  h+='<div class="chips">'+[5,10,25,50,100].map(v=>'<button type="button" class="chip" data-a="pct" data-v="'+v+'" aria-pressed="'+(S.pct===v)+'">'+v+'%</button>').join('')+'</div></section></div>';
  h+='<div class="col-side"><section class="card" aria-labelledby="h4"><div class="prev-h"><h2 id="h4" style="color:var(--blue)">Sample Preview</h2><span class="xs" style="margin-left:auto;background:#fff;border:1px solid #C9D8EC;border-radius:999px;padding:2px 9px;color:var(--blue-d)">'+(c.isInt?'Intelligent QA':'Random QA')+'</span></div>';
  h+='<div style="padding:16px;display:flex;flex-direction:column;gap:14px"><div class="grid2"><div><div class="big">'+fmt(c.sF)+'</div><div class="small muted">Folios to QA</div></div><div><div class="big">'+fmt(c.sE)+'</div><div class="small muted">Entries (ETs) to QA</div></div></div>';
  h+='<div style="border-top:1px solid var(--line2);padding-top:10px;display:flex;flex-direction:column;gap:7px"><div class="kv"><span class="muted">Batches selected</span><b>'+c.sb.length+'</b></div><div class="kv"><span class="muted">Eligible pool</span><b>'+fmt(c.pf)+' folios, '+fmt(c.pe)+' entries</b></div><div class="kv"><span class="muted">Entry types covered</span><b>'+c.etc+'</b></div><div class="kv"><span class="muted">Sampling</span><b>'+S.pct+'%</b></div></div></div></section>';
  h+='<section class="card sec" aria-labelledby="h5"><h2 id="h5">Allocate</h2>'+dd('expert',false);
  if(n){h+='<div class="card scroll-x"><table class="tbl"><thead><tr><th>Expert</th><th class="num">Folios</th><th class="num">Entries</th></tr></thead><tbody>'+ch.map((e,i)=>'<tr><td>'+e[1]+'</td><td class="num">'+fmt(Math.floor(c.sF/n)+(i<c.sF%n?1:0))+'</td><td class="num muted">'+fmt(Math.floor(c.sE/n)+(i<c.sE%n?1:0))+'</td></tr>').join('')+'</tbody></table></div>';}
  if(S.err)h+='<div class="alert" role="alert">'+S.err+'</div>';
  h+='<button type="button" class="btn btn-primary" style="height:40px" data-a="allocate">Allocate '+fmt(c.sF)+' Folios</button>';
  if(S.allocated)h+='<div class="okbox" role="status"><b style="font-weight:500;color:#0E6B49">Allocated '+fmt(S.allocatedScope.folioIds.length)+' folio(s) to '+n+' LPS QA expert(s)</b><span class="small" style="color:#1F5A43">'+fmt(S.allocatedScope.entryCount)+' entries in scope. Mobius analyst: '+esc(S.allocatedScope.analysts.join(', '))+'.</span><a class="btn btn-outline btn-sm" style="align-self:flex-start" href="'+reviewHref()+'">Open Review Queue</a></div>';
  h+='</section></div></div>';
  const ae=document.activeElement;const aid=ae&&ae.id;
  document.getElementById('root').innerHTML=h;
  document.getElementById('goReview').href=reviewHref();
  if(aid){const el=document.getElementById(aid);if(el)el.focus();}
}
const root=document.getElementById('root');
const setPct=v=>{S.pct=Math.max(1,Math.min(100,Math.round(+v||1)));S.allocated=false;S.allocatedScope=null;render();};
root.addEventListener('click',e=>{
  const el=e.target.closest('[data-a]');
  if(!el){if(S.open&&!e.target.closest('.dd-panel')){S.open=null;render();}return;}
  const a=el.dataset.a,v=el.dataset.v;
  if(a==='open'){S.open=S.open===v?null:v;render();}
  else if(a==='close'){S.open=null;render();}
  else if(a==='reset'){S.sel=Object.assign(DEF(),{expert:S.sel.expert});S.open=null;S.allocated=false;S.allocatedScope=null;S.err='';render();}
  else if(a==='pct')setPct(v);
  else if(a==='allocate'){const c=calc();const xs=S.sel.expert;const n=EXPERTS.filter(x=>xs.includes('ALL')||xs.includes(x[0])).length;
    S.open=null;S.allocated=false;
    if(!c.sb.length)S.err='Select at least one batch.';else if(c.sF<1)S.err='No folios match these filters. Widen the filters or raise the sampling %.';else if(!n)S.err='Choose at least one LPS QA expert to allocate to.';else{
      const pool=c.eligible.slice();
      for(let i=pool.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[pool[i],pool[j]]=[pool[j],pool[i]];}
      S.allocatedScope=scopeRecord(pool.slice(0,c.sF));S.err='';S.allocated=true;saveScope();
    }
    render();}
});
root.addEventListener('change',e=>{const el=e.target;const c=el.dataset.c;if(!c)return;
  if(c==='tog')toggle(el.dataset.id,el.dataset.v);
  else if(c==='mode'){S.mode=el.value;S.open=null;S.allocated=false;S.allocatedScope=null;render();}
  else if(c==='pct')setPct(el.value);});
root.addEventListener('input',e=>{if(e.target.dataset.i==='pctlive'){const n=document.getElementById('pctN');if(n)n.value=e.target.value;}});
// Batches, folios and entry types come from qa_data/index.json (written by qa_ingest.py).
async function enrichFolioCounts(item){
  if(item.entryTypeCounts&&Array.isArray(item.entryTypes))return item;
  try{
    const response=await fetch(item.json,{cache:'no-store'});
    if(!response.ok)return item;
    const folio=await response.json(),counts={};
    (folio.entries||[]).forEach(entry=>{
      const type=String(entry.type||'').trim();
      if(type)counts[type]=(counts[type]||0)+1;
    });
    item.entryTypes=Object.keys(counts);
    item.entryTypeCounts=counts;
  }catch(error){}
  return item;
}
async function boot(){
  try{
    const res=await fetch(DATA_ROOT+'/index.json',{cache:'no-store'});
    if(!res.ok)throw new Error('HTTP '+res.status);
    const index=await res.json();
    await Promise.all((index.batches||[]).flatMap(batch=>(batch.items||[]).map(enrichFolioCounts)));
    BATCHES=(index.batches||[]).map(b=>({v:b.name,folios:b.folios,entries:b.entries,items:b.items||[]}));
    FOLIOS={};ALL_FOLIOS=[];(index.batches||[]).forEach(b=>{
      FOLIOS[b.name]=(b.items||[]).map(it=>it.id);
      (b.items||[]).forEach(it=>ALL_FOLIOS.push(Object.assign({batch:b.name},it)));
    });
    ETS=(index.entryTypes||[]).map(e=>[e.name,e.weight]);
    S.ready=BATCHES.length>0;
  }catch(err){S.ready=false;}
  render();
}
boot();
</script>
